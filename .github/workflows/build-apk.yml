name: Build Number Game V2 APK

on:
workflow_dispatch:
push:
paths:
- 'main.py'
- 'Number_Game_V2_fixed.py'
- 'Number_Game_V2_Integrated_GUI.py'
- 'buildozer.spec'
- '.github/workflows/build-apk.yml'

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-22.04

steps:
  - name: Check out repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Linux dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git zip unzip \
        autoconf automake autopoint gettext \
        libtool pkg-config \
        zlib1g-dev libncurses5-dev libncursesw5-dev \
        libtinfo6 cmake libffi-dev libssl-dev

  - name: Install Rust
    uses: dtolnay/rust-toolchain@stable

  - name: Install Buildozer
    run: |
      python -m pip install --upgrade pip setuptools wheel virtualenv
      python -m pip install buildozer cython==0.29.34

  - name: Build APK
    run: buildozer -v android debug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Number-Game-V2-APK
      path: bin/*.apk
      if-no-files-found: error
